name: Build the TV app (APK)

# Builds the small Android TV / Google TV app that shows the meteor dashboard full screen,
# and publishes it as a download:  https://github.com/<you>/<repo>/releases/latest/download/family-language-tv.apk
# It runs when the app/ folder changes, or by hand: Actions › Build the TV app (APK) › Run workflow.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner already ships the Android SDK; just make sure the packages we need are there.
      - name: Android SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Bundle the dashboard into the app (offline fallback)
        run: |
          mkdir -p app/src/main/assets
          cp docs/tv.html docs/config.js docs/learn-core.js app/src/main/assets/

      - name: Build the APK
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          gradle :app:assembleDebug -PdashboardUrl="https://${OWNER}.github.io/${{ github.event.repository.name }}/tv.html"
          cp app/build/outputs/apk/debug/app-debug.apk family-language-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: family-language-tv-apk
          path: family-language-tv.apk

      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete tv-app --yes --cleanup-tag 2>/dev/null || true
          gh release create tv-app family-language-tv.apk --latest \
            --title "TV app" \
            --notes "Install this APK on a Google TV / Android TV / Fire TV. It opens the word meteor shower full screen. See the setup guide, step 7."
